<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ekspedisi Sistem Periodik Unsur — Kelas X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa;--surface:#ffffff;--surface2:#edf1f7;--text:#202938;--muted:#5a677d;
  --line:#dce3ed;--primary:#4263d8;--primary-soft:#e9edff;
  --good:#16834b;--goodbg:#eaf8f0;--warn:#a96809;--warnbg:#fff5df;--bad:#b32a24;--badbg:#fff0ef;
  --shadow:0 8px 24px rgba(39,52,76,.07);--r:17px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
h1,h2,h3,.title,.pill,.btn,.property-switch button,.property-cell,.eyebrow{font-family:"Space Grotesk","Inter","Segoe UI",system-ui,sans-serif;font-weight:700}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{width:min(1400px,100%);margin:auto;padding:12px 16px}
.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:white;display:grid;place-items:center;font-size:12px;font-weight:800}
.eyebrow{font-size:10px;line-height:1.2;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:800}
.title{font-size:18px;font-weight:800;letter-spacing:-.025em;white-space:nowrap}
.subtitle{font-size:11px;color:var(--muted)}
.progress{height:5px;background:#e1e6ee;border-radius:99px;overflow:hidden;margin-bottom:9px}
.progress span{display:block;height:100%;width:14%;background:var(--primary);transition:.3s}
.layout{display:block;height:calc(100vh - 94px);min-height:560px}
.nav{display:none}
.nav button{width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:11px;color:var(--muted);font-size:12px;font-weight:700;margin:1px 0;line-height:1.2}
.nav button.active{background:var(--primary-soft);color:var(--primary)}
.main{min-width:0;min-height:0;height:100%;overflow:hidden}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:9px}
.hero{height:100%;display:grid;grid-template-columns:1.08fr .92fr;gap:9px}
.hero>.card{margin:0;min-height:0}
h1,h2,h3,p{margin-top:0}
.hero h1{font-size:clamp(28px,3.1vw,44px);line-height:1.03;letter-spacing:-.055em;margin:8px 0}
.lead{font-size:13px;color:var(--muted);line-height:1.55}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.choice{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin:5px 0;font-size:12px;font-weight:700;transition:.15s}
.choice:hover{border-color:var(--primary);transform:translateY(-1px)}
.choice.correct{border-color:var(--good);background:var(--goodbg)}
.choice.wrong{border-color:var(--bad);background:var(--badbg)}
.feedback{padding:10px;border-radius:11px;margin-top:8px;font-size:12px;line-height:1.5;display:none}
.feedback.show{display:block}.feedback.good{background:var(--goodbg);color:#12683b}
.feedback.warn{background:var(--warnbg);color:#855107}.feedback.bad{background:var(--badbg);color:#8d241e}
.pill{display:inline-flex;padding:5px 8px;border-radius:99px;background:var(--surface2);font-size:10px;font-weight:800;color:var(--muted)}
.section-title{font-size:21px;font-weight:800;letter-spacing:-.035em;margin:6px 0}
.small{font-size:11px;color:var(--muted);line-height:1.5}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 12px;border-radius:11px;font-size:12px;font-weight:800}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.atom-stage{min-height:230px;display:grid;place-items:center;position:relative;overflow:hidden;border-radius:14px;background:radial-gradient(circle at center,#fff 0,#f5f7fa 66%,#edf0f5 100%)}
.atom{width:230px;height:230px;border-radius:50%;position:relative;display:grid;place-items:center}
.nucleus{width:42px;height:42px;border-radius:50%;background:#2d3a50;color:white;display:grid;place-items:center;font-size:12px;font-weight:800;z-index:4;box-shadow:0 6px 15px rgba(0,0,0,.14)}
.shell{position:absolute;border:2px solid #b5c0cf;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:appear .35s ease both}
.shell.s1{width:64px;height:64px}.shell.s2{width:112px;height:112px}.shell.s3{width:160px;height:160px}.shell.s4{width:208px;height:208px}
.electron{position:absolute;width:11px;height:11px;border-radius:50%;background:#4263d8;box-shadow:0 2px 5px rgba(66,99,216,.3);z-index:3}
.atom-label{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);padding:6px 8px;border-radius:9px;font-size:10px;font-weight:700}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px}.atom-card{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface)}
.mini-atom{height:210px;display:grid;place-items:center;overflow:hidden}.mini-atom .atom{transform:scale(.72)}
.slider-wrap{margin-top:9px}.slider{width:100%;accent-color:var(--primary)}
.cause{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:9px 0}
.cause span{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:10px;font-weight:700}
.cause b{color:var(--primary);font-size:11px}
.metric{font-size:28px;font-weight:800;letter-spacing:-.05em}
.meter{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;width:50%;background:var(--primary);transition:.4s}
.periodic-grid{display:grid;grid-template-columns:repeat(18,minmax(26px,1fr));gap:3px;overflow:auto;padding-bottom:5px}
.element{min-height:43px;border:1px solid var(--line);border-radius:7px;padding:3px;background:var(--surface);cursor:pointer;text-align:center}
.element:hover{transform:translateY(-1px)}.element .z{font-size:8px;color:var(--muted)}.element .sym{font-size:12px;font-weight:800}.element.active{outline:2px solid var(--primary)}
.quiz-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;font-size:11px}.quiz-row:last-child{border:0}
input[type=number],input[type=text],textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:60px;resize:vertical}
.footer{display:flex;justify-content:space-between;gap:8px;margin-top:9px}

/* ===== PETA TREN — compact fit-to-slide ===== */
.trend-summary-screen{
  overflow:hidden;
  height:100%;
  display:flex;
  flex-direction:column;
  padding:10px 14px 12px;
}
.trend-summary-screen .pill{flex:0 0 auto}
.trend-summary-screen .section-title{font-size:19px;margin:4px 0;flex:0 0 auto}
.trend-summary-screen .lead{font-size:12px;margin-bottom:6px;flex:0 0 auto}

.trend-map-card{
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface2);
  padding:8px 10px 8px;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
}
.trend-legend-top{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px;flex:0 0 auto}
.trend-direction{border-radius:8px;padding:5px 9px;background:var(--surface);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--text)}
.trend-direction b{font-weight:800}
.trend-direction span{font-weight:900;color:var(--primary);white-space:nowrap;font-size:10px}

.trend-table-area{
  position:relative;
  padding:6px 40px 6px;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.trend-periodic-grid{
  display:grid;
  grid-template-columns:repeat(18,minmax(0,1fr));
  grid-template-rows:repeat(7,1fr);
  gap:3px;
  position:relative;
  z-index:2;
  flex:1 1 auto;
  min-height:0;
  max-height:230px;
}
.trend-element{
  height:100%;
  min-height:0;
  border:1px solid #c8d3e2;
  border-radius:6px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1;
  position:relative;
  box-shadow:0 1px 2px rgba(30,45,70,.05);
}
.trend-element span{font-size:12px;font-weight:900;color:#1c2637}
.trend-element small{font-size:7px;font-weight:700;color:#5f6d82;margin-top:1px}

.trend-fblock{display:grid;grid-template-columns:36px repeat(14,minmax(0,1fr));gap:3px;margin-top:3px;position:relative;z-index:2;flex:0 0 auto}
.trend-fblock .trend-element{height:26px}
.trend-fblock .trend-element span{font-size:10px}
.trend-fblock .trend-element small{font-size:6px}
.f-name{font-size:8px;font-weight:900;color:#4a566b;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}

.trend-side-label{
  position:absolute;font-size:8px;font-weight:900;letter-spacing:.04em;
  background:rgba(255,255,255,.95);border:1px solid var(--line);
  border-radius:5px;padding:5px 3px;z-index:5;
  writing-mode:vertical-rl;white-space:nowrap;
  box-shadow:0 1px 3px rgba(30,45,70,.08)
}
.trend-side-label.top{right:4px;top:14px;color:#3a55b8}
.trend-side-label.bottom{left:4px;bottom:14px;color:#a05f18}

.trend-arrow{position:absolute;font-size:38px;font-weight:900;line-height:1;z-index:4;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.08)}
.arrow-up-right{right:4px;top:40px;color:#4a63c8}
.arrow-down-left{left:4px;bottom:40px;color:#d98a2b}

.trend-arrow-label{
  position:absolute;font-size:8px;font-weight:900;z-index:5;white-space:nowrap;
  background:rgba(255,255,255,.95);border:1px solid var(--line);
  padding:3px 6px;border-radius:5px;box-shadow:0 1px 3px rgba(30,45,70,.08)
}
.left-label{left:0;top:50%;transform:rotate(-90deg) translateX(-50%);transform-origin:left top;color:#a05f18}
.right-label{right:0;top:50%;transform:rotate(90deg) translateX(50%);transform-origin:right top;color:#3a55b8}

.trend-key{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding-top:5px;font-size:10px;color:#44516a;font-weight:600;flex:0 0 auto}
.trend-key span{display:inline-flex;align-items:center;gap:5px}
.trend-key b{font-weight:800;color:#2a3549}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#4263d8}
.dot.energy{background:#6574c8}
.dot.metal{background:#e49a42}

.reflect-bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:7px;
  flex:0 0 auto;
}
.meaning-card{box-shadow:none;background:var(--primary-soft);margin:0;padding:8px 10px}
.meaning-card .cause{margin:4px 0;gap:4px}
.meaning-card .cause span{padding:4px 6px;font-size:9px}
.meaning-card .cause b{font-size:10px}
.meaning-card .small{font-size:10px;line-height:1.35}

.reflection{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;align-items:start}
.reflection label{font-size:10px;font-weight:800;color:var(--text)}
.reflection textarea{min-height:34px;padding:6px;font-size:10px}
.reflection label:nth-of-type(1){grid-column:1}.reflection label:nth-of-type(2){grid-column:2}
.reflection textarea:nth-of-type(1){grid-column:1}.reflection textarea:nth-of-type(2){grid-column:2}

.trend-note{margin-top:5px;text-align:center;font-size:10px;color:#5a677d;flex:0 0 auto}

.summary-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;font-size:11px}
.summary-table th,.summary-table td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
.summary-table th{background:var(--surface2);font-weight:800}.summary-table tr:last-child td{border-bottom:0}
.arrow-down{font-weight:900;color:#3158c9}.arrow-right{font-weight:900;color:#3158c9}
.trend-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 7px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-size:10px;font-weight:800}
.one-screen{height:100%;overflow:hidden}
.fullscreen-btn-active{background:var(--primary-soft);color:var(--primary);border-color:#cdd7ff}
:fullscreen{background:var(--bg)}
:fullscreen .app{width:100%;max-width:1500px;height:100vh;padding:12px 18px}
:fullscreen .layout{height:calc(100vh - 94px)}
:fullscreen .main{overflow:hidden}

@keyframes appear{from{opacity:0;transform:translate(-50%,-50%) scale(.88)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

.slide-nav{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;z-index:50;
  background:rgba(255,255,255,.94);border:1px solid var(--line);
  border-radius:14px;padding:5px 6px;box-shadow:0 8px 24px rgba(39,52,76,.13);
  backdrop-filter:blur(10px)
}
.slide-nav button{
  border:0;border-radius:10px;padding:7px 12px;font-size:11px;font-weight:800;
  color:#fff;background:#4263d8;min-width:72px
}
.slide-nav button.prev{background:#718096}.slide-nav button:disabled{opacity:.32;cursor:not-allowed}
.slide-nav .counter{font-size:10px;font-weight:800;color:var(--muted);padding:0 4px;min-width:44px;text-align:center}
.slide-nav .next{background:#3158c9}
@media(max-width:620px){
  .slide-nav{bottom:9px}
  .slide-nav button{min-width:62px;padding:7px 9px;font-size:10px}
  .slide-nav .counter{min-width:38px}
  .main{padding-bottom:70px}
}
/* Tombol fixed di desktop: kasih ruang bawah pada slide peta tren */
@media(min-width:621px){
  .trend-summary-screen{padding-bottom:56px}
}

@media(max-width:900px){
 .layout{grid-template-columns:1fr;height:auto;min-height:0}.nav{display:flex;overflow:auto;position:static}.nav button{white-space:nowrap;width:auto}.main{overflow:visible}.hero{height:auto}
 .trend-legend-top{grid-template-columns:repeat(2,1fr)}
 .trend-periodic-grid{min-width:720px;max-height:none}
 .trend-table-area{overflow-x:auto}
 .reflect-bottom{grid-template-columns:1fr}
 .reflection{grid-template-columns:1fr}
 .reflection label,.reflection textarea{grid-column:1!important}
}
@media(max-width:620px){
 .app{padding:9px}.title{font-size:16px}.topbar{height:48px}.grid2,.compare,.hero{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,1fr)}
 .atom-stage{min-height:210px}.mini-atom{height:190px}
}

/* Mission 04 compact IFP layout */
.ion-slide{padding-bottom:12px}
.ion-compare{gap:8px;align-items:stretch}
.ion-card{padding:9px;min-width:0;display:flex;flex-direction:column}
.ion-head{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:31px}
.ion-head b{font-size:17px;letter-spacing:-.03em}
.ion-stage{min-height:165px;height:165px;margin-top:6px;border-radius:12px}
.ion-stage .atom{transform:scale(.64)}
.ion-note{font-size:10px;color:var(--muted);margin:5px 0 6px;line-height:1.35}
.ion-btn{align-self:flex-start;padding:7px 10px;font-size:10px}
.ion-feedback{font-size:9px;padding:6px;margin-top:5px;line-height:1.35}
.logic-card{background:var(--surface2);box-shadow:none}
.logic-stack{display:grid;gap:7px;margin:9px 0}
.logic-stack>div{display:grid;grid-template-columns:auto auto 12px auto 12px 1fr;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px;font-size:9px;line-height:1.25}
.logic-stack strong{font-size:15px}.logic-stack b{color:var(--primary);text-align:center}
.ion-key{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:7px;border-radius:9px;background:var(--primary-soft);font-size:9px;font-weight:800;color:var(--primary)}
.ion-quiz{margin-top:8px}.ion-quiz p{font-size:10px;margin-bottom:5px;line-height:1.3}
.ion-quiz .choice{padding:6px 8px;margin:3px 0;font-size:9px}
.ion-takeaway{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:10px;line-height:1.4;color:var(--muted)}
.property-switch{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0}
.property-switch button{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;font-size:11px;font-weight:800;color:var(--muted)}
.property-switch button.active{background:var(--primary);border-color:var(--primary);color:#fff}
.property-table-wrap{border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--surface2);overflow:hidden}
.property-grid{display:grid;grid-template-columns:repeat(18,minmax(38px,1fr));grid-template-rows:repeat(7,43px);gap:3px;min-width:760px}
.property-cell{width:100%;height:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.property-cell:hover{border-color:var(--primary);transform:translateY(-1px)}
.property-cell.selected{outline:2px solid var(--primary);background:var(--primary-soft)}
.property-cell.missing{opacity:.72}
.property-cell .pz{font-size:7px;color:var(--muted)}
.property-cell .ps{font-size:14px;font-weight:900;line-height:1}
.property-cell .pv{font-size:10px;color:var(--primary);font-weight:900;margin-top:3px;white-space:nowrap}
.property-cell .both-line{font-size:8px;font-weight:900;margin-top:2px;line-height:1.05;white-space:nowrap}
.fblock{margin-top:5px;display:grid;gap:3px;min-width:760px}
.fblock-row{display:grid;grid-template-columns:38px repeat(14,minmax(38px,1fr));gap:3px}
.fblock-row>div{min-height:34px}
.flabel{display:grid;place-items:center;font-size:8px;font-weight:800;color:var(--muted)}
.property-info{display:grid;grid-template-columns:.85fr 1.15fr;gap:8px;margin-top:6px;padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.property-info .big{font-size:18px;font-weight:900}
.trend-map{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center;margin-top:6px}
.definition{padding:6px 8px;border-radius:9px;background:var(--surface2);font-size:9px;line-height:1.3}
.trend-map .arrow{font-size:18px;font-weight:900;color:var(--primary)}

/* ===== SPU lengkap — 118 unsur, tetap compact dan harmonis ===== */
.full-periodic-screen{display:flex;flex-direction:column;height:100%;overflow:hidden}
.full-periodic-screen .periodic-wrap{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:7px;overflow:hidden}
.full-periodic-grid{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));grid-template-rows:repeat(7,39px);gap:3px;min-width:760px}
.full-periodic-grid .element{min-height:0;height:39px;padding:2px}
.full-periodic-grid .element .z{font-size:7px}.full-periodic-grid .element .sym{font-size:12px}
.full-fblock{display:grid;grid-template-columns:42px repeat(14,minmax(0,1fr));gap:3px;margin-top:4px;min-width:760px}
.full-fblock .element{height:32px;min-height:32px}.full-fblock .element .sym{font-size:11px}.full-fblock .element .z{font-size:6px}
.full-f-label{display:grid;place-items:center;font-size:8px;font-weight:800;color:var(--muted)}
.periodic-info{margin-top:7px;padding:8px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.periodic-info .selected-symbol{font-family:"Space Grotesk";font-size:28px;font-weight:700;line-height:1}
.periodic-info .selected-name{font-size:11px;color:var(--muted);margin-top:2px}
.periodic-info .info-facts{display:flex;flex-wrap:wrap;gap:5px}.periodic-info .info-facts span{padding:5px 7px;background:var(--surface);border:1px solid var(--line);border-radius:7px;font-size:9px;font-weight:700}
.periodic-hint{margin-top:5px;font-size:9px;color:var(--muted)}

/* property map remains one interactive slide */
.property-screen{display:flex;flex-direction:column;height:100%;overflow:hidden}
.property-screen .property-table-wrap{flex:1 1 auto;min-height:0}
.property-screen .property-grid{grid-template-rows:repeat(7,40px)}
.property-screen .property-cell .ps{font-family:"Space Grotesk";font-size:13px}

/* Mission 03 — compact 3-column IFP layout */
.radius-compare{grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:10px;align-items:stretch}
.radius-card{min-height:0;padding:14px;display:flex;flex-direction:column}

 function ionization(){

 function propertyTable(){

 function choice(container,correct,onCorrect,onWrong){
   if(!container) return;
   const buttons=container.querySelectorAll(".choice");
   let solved=false;
   buttons.forEach(button=>{
     button.addEventListener("click",()=>{
       if(solved) return;
       const value=String(button.dataset.value ?? "");
       const expected=String(correct ?? "");
       const isCorrect=value===expected;

       buttons.forEach(b=>b.classList.remove("correct","wrong"));
       button.classList.add(isCorrect ? "correct" : "wrong");

       if(isCorrect){
         solved=true;
         setScore(10);
         if(typeof onCorrect==="function") onCorrect(button);
       }else{
         if(typeof onWrong==="function") onWrong(button);
       }
     });
   });
 }

 function setScore(points){
   const n=Number(points)||0;
   state.score+=n;
   if(score) score.textContent=state.score+" XP";
 }

 function feedback(id,type,msg){
   const element=document.getElementById(id);
   if(!element) return;
   element.className="feedback show "+type;
   element.innerHTML=msg;
 }

 function render(){
   renderNav();
   bar.style.width=((state.page+1)/pages.length*100)+"%";
   const views=[capture,connect,radius,ionization,electro,affinity,propertyTable,periodic,mystery,challenge,reflect];
   if(typeof views[state.page]==="function"){
     views[state.page]();
   }else{
     main.innerHTML=`<section class="card"><h2 class="section-title">Aktivitas belum tersedia</h2><p class="lead">Silakan kembali ke aktivitas sebelumnya.</p></section>`;
   }
 }

 document.addEventListener("keydown",e=>{
   if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) return;
   if(e.key==="ArrowRight" && state.page<pages.length-1){state.page++;render();}
   if(e.key==="ArrowLeft" && state.page>0){state.page--;render();}
 });

 return {render};
})();
App.render();

(function setupFullscreen(){
  const btn=document.getElementById("fullscreenBtn");
  if(!btn) return;

  const setState=()=>{
    const active=!!document.fullscreenElement;
    btn.innerHTML=active?"⛶ Keluar Fullscreen":"⛶ Fullscreen";
    btn.setAttribute("aria-label",active?"Keluar dari fullscreen":"Aktifkan fullscreen");
    btn.classList.toggle("fullscreen-btn-active",active);
  };

  btn.addEventListener("click",async()=>{
    try{
      if(!document.fullscreenElement){
        await document.documentElement.requestFullscreen();
      }else{
        await document.exitFullscreen();
      }
    }catch(err){
      btn.title="Fullscreen diblokir browser. Gunakan F11.";
    }
    setState();
  });

  document.addEventListener("fullscreenchange",setState);
  setState();
})();

window.addEventListener("error",function(ev){
  const main=document.getElementById("main");
  if(main && ev.error){
    const existing=document.getElementById("runtimeError");
    if(!existing){
      const box=document.createElement("div");
      box.id="runtimeError";
      box.style.cssText="position:fixed;right:14px;bottom:62px;z-index:9999;max-width:420px;background:#fff;border:1px solid #f0caca;border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.12);font:600 12px/1.5 system-ui;color:#8d241e";
      box.innerHTML="<b>Aktivitas mengalami kesalahan kecil.</b><br>"+String(ev.error.message||ev.message).replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]});
      document.body.appendChild(box);
    }
  }
});
